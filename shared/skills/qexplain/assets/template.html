<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<!--
  /qexplain artifact template. Do not edit this file per artifact.
  scripts/build-explanation.py fills the double-brace placeholders and the slots named below, and
  removes every part that was not selected (both its button and its panel). Everything after the
  DATA slot is fixed code shared by every artifact.
-->
<script>
  // Apply the stored theme and sketch setting before first paint, so a reader never sees a flash.
  try { if (localStorage.getItem('qexplain-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  try { if (localStorage.getItem('qexplain-sketch') === 'classic') document.documentElement.setAttribute('data-sketch', 'classic'); } catch (e) {}
</script>
<!--@MERMAID-->
<style>
  /* ---- Theme variables ---- */
  :root {
    --bg: #fafafa; --surface: #fff; --text: #1a1a1a; --text-light: #546e7a;
    --border: #ddd; --border-strong: #ccc; --pre-bg: #f0f0f0;
    --callout-bg: #f0f6ff; --callout-border: #0066cc;
    --link: #0066cc; --btn-bg: #f7f7f7;
    --cy-bg: #f7f9fc; --cy-border: #e0e0e0;
    --toggle-bg: #e0e0e0; --toggle-text: #333;
    --part-bar-h: 43px;
  }
  [data-theme="dark"] {
    --bg: #1a1a1a; --surface: #242424; --text: #e8e8e8; --text-light: #90a4ae;
    --border: #3a3a3a; --border-strong: #4a4a4a; --pre-bg: #2a2a2a;
    --callout-bg: #1a2a3a; --callout-border: #4a8ac4;
    --link: #64b5f6; --btn-bg: #2e2e2e;
    --cy-bg: #1e2430; --cy-border: #3a3a3a;
    --toggle-bg: #3a3a3a; --toggle-text: #e0e0e0;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.6; color: var(--text); background: var(--bg); margin: 0; padding: 0;
  }
  .theme-toggle {
    position: fixed; top: 0.5rem; right: 1rem; z-index: 200;
    padding: 0.25rem 0.6rem; border-radius: 4px; border: 1px solid var(--border-strong);
    background: var(--toggle-bg); color: var(--toggle-text); font-size: 0.82rem; cursor: pointer; user-select: none;
  }
  .theme-toggle:hover { opacity: 0.8; }
  .sketch-toggle { right: 7.5rem; }
  .page { max-width: 780px; margin: 0 auto; padding: 0 1.5rem 4rem; }
  body.wide-part .page { max-width: min(1700px, 96vw); }
  h1 { font-size: 1.5rem; margin-top: 2rem; margin-bottom: 0.25rem; }
  h2 { font-size: 1.15rem; margin-top: 2rem; }
  h3 { font-size: 1rem; margin-top: 1.5rem; color: var(--text-light); }
  p { margin: 0.75rem 0; }
  a { color: var(--link); }
  img, svg, video { max-width: 100%; }
  pre {
    background: var(--pre-bg); border-left: 3px solid var(--border-strong); padding: 0.75rem 1rem;
    overflow-x: auto; font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap; border-radius: 3px;
  }
  code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 0.9em; background: var(--pre-bg); padding: 0.1em 0.3em; border-radius: 2px; white-space: pre-wrap; }
  .callout { border-left: 4px solid var(--callout-border); background: var(--callout-bg); padding: 0.75rem 1rem; margin: 1rem 0; border-radius: 0 4px 4px 0; font-size: 0.95rem; }
  .callout.warn { border-color: #cc8800; }
  /* Part bar */
  .part-bar { position: sticky; top: 0; background: var(--surface); border-bottom: 2px solid var(--border); z-index: 100; display: flex; flex-wrap: wrap; padding: 0 13rem 0 1.5rem; }
  .part-btn { padding: 0.6rem 1.2rem; border: none; background: none; cursor: pointer; font-size: 0.9rem; font-weight: 500; color: var(--text-light); border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .part-btn.active { color: var(--link); border-bottom-color: var(--link); }
  .part-panel { display: none; }
  .part-panel.active { display: block; }
  /* Provenance strip */
  .prov { border: 1px solid var(--border); border-radius: 4px; background: var(--btn-bg); padding: 0.5rem 0.8rem; margin: 1rem 0; font-size: 0.78rem; line-height: 1.5; color: var(--text-light); }
  .prov b { color: var(--text); font-weight: 600; }
  .prov span.prov-row { display: block; }
  #part-diff .prov { margin: 0 0 16px; }
  /* Sub-tabs (one per subsystem) and map tabs */
  .sub-bar, .map-bar { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; padding-top: 1rem; }
  .sub-bar { border-bottom: 1px solid var(--border); padding-bottom: 0.6rem; }
  .sub-btn, .map-btn { padding: 0.35rem 0.8rem; border: 1px solid var(--border-strong); border-radius: 3px; background: var(--btn-bg); cursor: pointer; font-size: 0.82rem; color: var(--text); }
  .sub-btn.active, .map-btn.active { background: var(--link); color: #fff; border-color: var(--link); }
  .sub-panel, .map-panel { display: none; }
  .sub-panel.active, .map-panel.active { display: block; }
  .map-note { font-size: 0.85rem; color: var(--text-light); font-style: italic; }
  .chg { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; margin: 0 0 0.4rem; cursor: pointer; user-select: none; }
  /* Diagrams. D2 comes as four inlined SVGs (light or dark, sketch or classic); CSS shows one. */
  .dg { margin: 1.2rem 0; width: min(1100px, calc(100vw - 32px)); position: relative; left: 50%; transform: translateX(-50%); }
  body.wide-part .dg { width: auto; left: 0; transform: none; }
  .dgv, .dg .mmd { cursor: zoom-in; }
  .dgv { border: 1px solid var(--cy-border); border-radius: 4px; overflow-x: auto; background: var(--cy-bg); }
  .dgv > svg { display: block; max-width: 100%; max-height: 75vh; height: auto; margin: 0 auto; }
  html[data-theme="dark"] .dgv.v-light, html:not([data-theme="dark"]) .dgv.v-dark { display: none; }
  html[data-sketch="classic"] .dgv.v-sketch, html:not([data-sketch="classic"]) .dgv.v-classic { display: none; }
  /* Guided tour: dim everything but the step, outline the step */
  .dgv > svg.tour-on g.dim { opacity: 0.18; transition: opacity 0.2s; }
  .dgv > svg.tour-on g.tour-hl { filter: drop-shadow(0 0 2px #f57c00) drop-shadow(0 0 1px #f57c00); }
  .mmd svg g.dim, .mmd svg path.dim, .mmd svg .edgeLabel.dim { opacity: 0.18; }
  .mmd svg g.tour-hl { filter: drop-shadow(0 0 2px #f57c00) drop-shadow(0 0 1px #f57c00); }
  /* Show changes off: the highlighted classes look like existing parts. Arrowheads keep their colour. */
  .dg.plain .v-light g.new > .shape > *, .dg.plain .v-light g.changed > .shape > *, .dg.plain .v-light g.removed > .shape > * { fill: #eef1f4 !important; stroke: #9aa5b2 !important; stroke-dasharray: none !important; }
  .dg.plain .v-dark g.new > .shape > *, .dg.plain .v-dark g.changed > .shape > *, .dg.plain .v-dark g.removed > .shape > * { fill: #222a33 !important; stroke: #5a6573 !important; stroke-dasharray: none !important; }
  .dg.plain .v-light g.new text, .dg.plain .v-light g.changed text, .dg.plain .v-light g.removed text { fill: #1d2530 !important; }
  .dg.plain .v-dark g.new text, .dg.plain .v-dark g.changed text, .dg.plain .v-dark g.removed text { fill: #e3e8ee !important; }
  .dg.plain .v-light g.new-edge path.connection, .dg.plain .v-light g.changed-edge path.connection, .dg.plain .v-light g.removed-edge path.connection { stroke: #0d32b2 !important; stroke-width: 2px !important; stroke-dasharray: none !important; }
  .dg.plain .v-dark g.new-edge path.connection, .dg.plain .v-dark g.changed-edge path.connection, .dg.plain .v-dark g.removed-edge path.connection { stroke: #cba6f7 !important; stroke-width: 2px !important; stroke-dasharray: none !important; }
  .dg.plain .v-light marker .connection { fill: #0d32b2 !important; }
  .dg.plain .v-dark marker .connection { fill: #cba6f7 !important; }
  .dg.plain g.removed, .dg.plain g.removed-edge { display: none; }
  /* Click a diagram to read it full window */
  #dg-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78); z-index: 500; overflow: auto; padding: 3rem 2vw 2rem; }
  #dg-overlay[hidden] { display: none; }
  #dg-ov-body { background: var(--cy-bg); border-radius: 4px; padding: 0.5rem; width: 96vw; }
  #dg-ov-body > svg { display: block; width: 100%; max-width: none; max-height: none; height: auto; }
  #dg-close { position: fixed; top: 0.6rem; right: 1rem; z-index: 510; padding: 0.25rem 0.7rem; border-radius: 4px; border: 1px solid var(--border-strong); background: var(--toggle-bg); color: var(--toggle-text); cursor: pointer; }
  /* Tour */
  .tour-box { display: flex; align-items: center; gap: 0.5rem; background: var(--btn-bg); border: 1px solid var(--border); border-radius: 4px; padding: 0.5rem 0.75rem; margin-top: 0.6rem; font-size: 0.88rem; }
  .tour-box button { padding: 0.2rem 0.6rem; border: 1px solid var(--border-strong); border-radius: 3px; background: var(--surface); color: var(--text); cursor: pointer; font-size: 0.82rem; }
  .tour-caption { flex: 1; }
  .tour-step-label { color: var(--text-light); font-size: 0.8rem; white-space: nowrap; }
  .seq-highlight { outline: 2px solid #f57c00 !important; outline-offset: 3px; }
  text.seq-highlight { fill: #f57c00 !important; font-weight: bold; }
  /* Change summary */
  table { border-collapse: collapse; width: 100%; font-size: 0.88rem; margin: 1rem 0; }
  th { background: var(--pre-bg); text-align: left; padding: 0.4rem 0.6rem; border-bottom: 2px solid var(--border-strong); }
  td { padding: 0.35rem 0.6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  .table-wrap { overflow-x: auto; }
  td.fcol { overflow-wrap: anywhere; font-family: "SFMono-Regular", Consolas, monospace; font-size: 0.82rem; }
  .mermaid { margin: 1.5rem 0; overflow-x: auto; }

  /* ===== Diff review ===== */
  :root { --nav-w: 290px; --header-h: 56px; }
  #part-diff, [data-theme="dark"] #part-diff { --bg:#0d1117; --surface:#161b22; --border:#30363d; --text:#c9d1d9; --muted:#8b949e; --accent:#58a6ff; --add-bg:#0d4429; --add-fg:#3fb950; --del-bg:#67060c; --del-fg:#f85149; --hunk-bg:#1c2d3a; --hunk-fg:#79c0ff; --rv-bg:rgba(63,185,80,.06); }
  html:not([data-theme="dark"]) #part-diff { --bg:#f6f8fa; --surface:#fff; --border:#d0d7de; --text:#1f2328; --muted:#57606a; --accent:#0969da; --add-bg:#e6ffec; --add-fg:#1a7f37; --del-bg:#ffebe9; --del-fg:#cf222e; --hunk-bg:#ddf4ff; --hunk-fg:#0550ae; --rv-bg:rgba(26,127,55,.05); }
  #part-diff { background: var(--bg); color: var(--text); font-size: 13px; min-height: 100vh; }
  #header { position: fixed; top: var(--part-bar-h); left: 0; right: 0; min-height: 56px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 6px 16px; gap: 10px 12px; z-index: 90; flex-wrap: wrap; }
  #header h1 { font-size: 14px; font-weight: 700; margin: 0; }
  #search { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 6px; width: 180px; font-size: 12px; }
  #search:focus { outline: none; border-color: var(--accent); }
  #filter-group { display: flex; gap: 5px; flex-wrap: wrap; }
  .fbtn { background: var(--bg); border: 1px solid var(--border); color: var(--muted); padding: 3px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; }
  .fbtn:hover, .fbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #progress { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .kbd { display: inline-block; background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; font-family: monospace; font-size: 10px; color: var(--muted); }
  .nbtn { background: var(--bg); border: 1px solid var(--border); color: var(--muted); padding: 3px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; white-space: nowrap; }
  .nbtn:hover { border-color: var(--accent); color: var(--accent); }
  .hashpill { display: inline-flex; align-items: center; gap: 5px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 2px 8px 2px 10px; font-family: monospace; font-size: 11px; max-width: 260px; overflow: hidden; }
  .hashpill span { color: var(--muted); }
  .hashpill b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hcpbtn { background: none; border: 1px solid var(--border); border-radius: 3px; cursor: pointer; color: var(--muted); font-size: 10px; padding: 0 4px; }
  .hcpbtn:hover { color: var(--accent); } .hcpbtn.copied { color: var(--add-fg); }
  #navview { display: flex; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .nvbtn { background: var(--bg); border: none; color: var(--muted); padding: 3px 9px; font-size: 11px; cursor: pointer; }
  .nvbtn.on { background: var(--accent); color: #fff; }
  #nav { position: fixed; top: calc(var(--part-bar-h) + var(--header-h)); left: 0; bottom: 0; width: var(--nav-w); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--border); padding: 8px 0; z-index: 50; }
  #nav-resizer { position: fixed; top: calc(var(--part-bar-h) + var(--header-h)); left: var(--nav-w); bottom: 0; width: 5px; cursor: col-resize; z-index: 60; }
  #nav-resizer:hover, #nav-resizer.dragging { background: var(--accent); }
  .ng-label { padding: 6px 12px 3px; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; cursor: pointer; display: flex; justify-content: space-between; user-select: none; }
  .ci { font-size: 9px; transition: transform .15s; }
  .ng.collapsed .ci { transform: rotate(-90deg); }
  .ng.collapsed .ni-wrap { display: none; }
  .ni { display: flex; align-items: center; gap: 6px; padding: 5px 12px 5px 16px; cursor: pointer; text-decoration: none; color: var(--muted); border-left: 2px solid transparent; }
  .ni:hover { color: var(--text); }
  .ni.on { background: rgba(88,166,255,.08); color: var(--accent); border-left-color: var(--accent); }
  .ni.rv { border-left-color: var(--add-fg); }
  .nfn { flex: 1; font-family: monospace; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nbadge { display: flex; gap: 4px; }
  .b { padding: 1px 5px; border-radius: 3px; font-size: 10px; font-weight: 600; font-family: monospace; }
  .ba { background: rgba(63,185,80,.15); color: var(--add-fg); }
  .bd { background: rgba(248,81,73,.15); color: var(--del-fg); }
  .bn { background: rgba(88,166,255,.15); color: var(--accent); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
  .rv .dot { background: var(--add-fg); }
  .tdir { display: flex; align-items: center; gap: 4px; padding: 4px 8px 4px 12px; cursor: pointer; font-size: 11px; color: var(--muted); user-select: none; }
  .tdir-name { font-family: monospace; color: var(--text); }
  .tdir-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
  .tdir-dot.all-rv { background: var(--add-fg); }
  .tdir-ci { font-size: 9px; transition: transform .15s; }
  .tdir.col > .tdir-ci { transform: rotate(-90deg); }
  .tdir.col + .tch { display: none; }
  .tch { padding-left: 14px; border-left: 1px solid var(--border); margin-left: 16px; }
  #main { margin-left: var(--nav-w); padding: calc(var(--part-bar-h) + var(--header-h) + 20px) 24px 20px; }
  .fc { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; overflow: hidden; scroll-margin-top: calc(var(--part-bar-h) + var(--header-h) + 8px); }
  .fc.rv { border-color: var(--add-fg); background: var(--rv-bg); }
  .fc.hide { display: none; }
  .fh { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
  .ft { font-family: monospace; font-size: 12px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fstats { display: flex; gap: 6px; align-items: center; }
  .rbtn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 3px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; white-space: nowrap; }
  .rbtn:hover { border-color: var(--add-fg); color: var(--add-fg); }
  .rv .rbtn { background: rgba(63,185,80,.15); border-color: var(--add-fg); color: var(--add-fg); }
  .colbtn { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px; transition: transform .15s; }
  .fc.iscol > .fh > .colbtn { transform: rotate(-90deg); }
  .rat { padding: 8px 14px 6px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); }
  .notearea { background: transparent; border: none; border-bottom: 1px dashed var(--border); color: var(--text); font-size: 11px; width: 100%; resize: vertical; padding: 5px 14px; font-family: inherit; min-height: 26px; }
  .notearea:focus { outline: none; border-bottom-color: var(--accent); }
  .db.col { display: none; }
  .sp { display: grid; grid-template-columns: 1fr 1fr; }
  .pane { overflow-x: auto; }
  .pane + .pane { border-left: 2px solid var(--border); }
  table.dt { width: 100%; border-collapse: collapse; margin: 0; font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; font-size: 11.5px; table-layout: fixed; }
  table.dt col.lnc { width: 46px; }
  table.dt td { padding: 0 8px; white-space: pre; vertical-align: top; border: none; line-height: 1.65; overflow: hidden; text-overflow: ellipsis; cursor: text; }
  table.dt td.expanded { white-space: pre-wrap; overflow: visible; text-overflow: clip; }
  table.dt td.ln { color: var(--muted); text-align: right; font-size: 10px; padding: 0 6px; border-right: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; overflow: visible; }
  tr.add td { background: var(--add-bg); } tr.add td.ln { color: var(--add-fg); }
  tr.del td { background: var(--del-bg); } tr.del td.ln { color: var(--del-fg); }
  tr.hunk td { background: var(--hunk-bg); color: var(--hunk-fg); font-style: italic; }
  .page :is(h1, h2, h3, h4) { scroll-margin-top: calc(var(--part-bar-h, 48px) + 12px); }
  .page code { overflow-wrap: anywhere; }
  .file-msg { padding: 16px 20px; color: var(--muted); font-size: 12px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px); background: #333; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 12px; z-index: 9999; pointer-events: none; transition: transform .25s, opacity .25s; opacity: 0; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  @media (max-width: 760px) {
    .page { padding: 0 1rem 3rem; }
    .part-bar { padding: 0 10.5rem 0 0.5rem; }
    .part-btn { padding: 0.5rem 0.6rem; }
    #header { position: static; }
    #nav, #nav-resizer { display: none; }
    #main { margin-left: 0; padding: 12px; }
    .sp { grid-template-columns: 1fr; }
    .pane + .pane { border-left: none; border-top: 2px solid var(--border); }
  }
</style>
</head>
<body>

  <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle dark/light mode">Theme</button>
  <button class="theme-toggle sketch-toggle" id="sketch-toggle" onclick="toggleSketch()" title="Switch the diagrams between sketch and classic style" hidden>Classic style</button>

<!--@PART:diff--><div id="part-diff" class="part-panel">
  <div id="header">
    <h1>{{TITLE}}</h1>
    <div class="hashpill" title="{{BASE_REF}}"><span>base</span><b>{{BASE_REF}}</b><button class="hcpbtn" id="hcp-base" onclick="copyRef('base')" title="Copy">copy</button></div>
    <div class="hashpill" title="{{HEAD_REF}}"><span>head</span><b>{{HEAD_REF}}</b><button class="hcpbtn" id="hcp-head" onclick="copyRef('head')" title="Copy">copy</button></div>
    <input id="search" type="text" placeholder="Filter files" oninput="filterFiles()">
    <div id="navview"><button class="nvbtn on" onclick="setNavView('group', this)">Group</button><button class="nvbtn" onclick="setNavView('tree', this)">Tree</button></div>
    <div id="filter-group"></div>
    <div id="progress">Reviewed: <span id="rc">0</span>&thinsp;/&thinsp;<span id="tc">0</span></div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <button class="nbtn" onclick="navHunk(-1)">Prev hunk</button><button class="nbtn" onclick="navHunk(1)">Next hunk</button>
      <button class="nbtn" onclick="navFile(-1)">Prev file</button><button class="nbtn" onclick="navFile(1)">Next file</button>
      <button class="nbtn" id="copy-notes" onclick="copyNotes()">Copy notes</button>
      <span style="color:var(--muted);font-size:11px"><span class="kbd">j/k</span> hunk <span class="kbd">J/K</span> file <span class="kbd">m</span> mark <span class="kbd">c</span> collapse</span>
    </div>
  </div>
  <div id="nav"><div id="nav-inner"></div></div>
  <div id="nav-resizer" title="Drag to resize, double-click to reset"></div>
  <div id="main"><!--@PROVENANCE--><div id="excluded-note"></div><div id="fc"></div></div>
</div><!--@/PART:diff-->
<div id="dg-overlay" hidden><button id="dg-close" type="button">Close</button><div id="dg-ov-body"></div></div>
<div id="toast"></div>

<script>
/*@DATA*/

// ======================= Fixed code below: shared by every artifact =======================

const VIEWS = QX.views || [];           // [{vid, key, kind: 'd2'|'mermaid', seq, tour: [{caption, highlight, mark, lit}], tokens}]
const VIEW_BY_ID = Object.fromEntries(VIEWS.map(v => [v.vid, v]));
const PART_KEYS = Array.from(document.querySelectorAll('.part-btn')).map(b => b.dataset.part);
const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function jsq(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
let currentVid = null;

// ---------------- Part switching and URL hash (#part or #maps/view) ----------------
function switchPart(key, saveHash) {
  if (!PART_KEYS.includes(key)) return;
  document.querySelectorAll('.part-panel').forEach(p => p.classList.toggle('active', p.id === 'part-' + key));
  document.querySelectorAll('.part-btn').forEach(b => b.classList.toggle('active', b.dataset.part === key));
  document.body.classList.toggle('wide-part', key !== 'brief' && key !== 'walkthrough');
  if (key === 'maps') ensureMaps();
  if (key === 'diff') ensureDiff();
  renderMermaid(document.getElementById('part-' + key), key === 'maps' ? () => renderTourStep(currentVid) : null);
  if (saveHash !== false) updateHash();
}
function updateHash() {
  const part = (document.querySelector('.part-btn.active') || {}).dataset;
  if (!part) return;
  history.replaceState(null, '', '#' + part.part + (part.part === 'maps' && currentVid ? '/' + currentVid : ''));
}
function restoreFromHash() {
  const [part, view] = location.hash.replace('#', '').split('/');
  if (!PART_KEYS.includes(part)) return;
  switchPart(part, false);
  if (part === 'maps' && VIEW_BY_ID[view]) switchMap(view, false);
}

// ---------------- Sub-tabs: one per subsystem, in the Walkthrough and Maps parts ----------------
function activateSub(group, id) {
  document.querySelectorAll('.sub-panel[data-group="' + group + '"]').forEach(p => p.classList.toggle('active', p.id === 'sub-' + id));
  document.querySelectorAll('.sub-btn[data-group="' + group + '"]').forEach(b => b.classList.toggle('active', b.dataset.sub === id));
}
function switchSub(group, id) {
  activateSub(group, id);
  const panel = document.getElementById('sub-' + id);
  if (group === 'maps') {
    const act = panel.querySelector('.map-btn.active') || panel.querySelector('.map-btn');
    if (act) switchMap(act.dataset.view, false);
  } else renderMermaid(panel);
}

// ---------------- Maps ----------------
function ensureMaps() {
  if (window._mapsInit) return;
  window._mapsInit = true;
  VIEWS.forEach(v => { tourState[v.vid] = 0; });
  const first = document.querySelector('#part-maps .sub-panel.active .map-btn.active, #part-maps > .page > .map-bar .map-btn.active')
    || document.querySelector('#part-maps .map-btn');
  if (first) switchMap(first.dataset.view, false);
}
function switchMap(vid, saveHash) {
  const v = VIEW_BY_ID[vid];
  if (!v) return;
  const panel = document.getElementById('view-' + vid);
  const sub = panel.closest('.sub-panel');
  if (sub) activateSub('maps', sub.id.slice(4));
  const scope = sub || document.getElementById('part-maps');
  scope.querySelectorAll('.map-panel').forEach(p => p.classList.toggle('active', p === panel));
  scope.querySelectorAll('.map-btn').forEach(b => b.classList.toggle('active', b.dataset.view === vid));
  currentVid = vid;
  if (tourState[vid] === undefined) tourState[vid] = 0;
  renderMermaid(panel, () => renderTourStep(vid));
  renderTourStep(vid);
  if (saveHash !== false) updateHash();
}
// "Show changes" switch on a D2 diagram: off makes the highlighted classes look like existing parts.
function toggleChanges(box) {
  const dg = document.getElementById(box.dataset.target);
  if (!dg) return;
  dg.classList.toggle('plain', !box.checked);
  mermaidPlain(dg);
}
// Mermaid nodes carry their classDef names as classes. Off: new and changed look like existing, removed is hidden.
function mermaidPlain(dg) {
  const plain = dg.classList.contains('plain'), fill = isDark() ? '#222a33' : '#eef1f4', stroke = isDark() ? '#5a6573' : '#9aa5b2';
  dg.querySelectorAll('.mmd g.node').forEach(g => {
    const c = g.classList;
    if (c.contains('removed')) g.style.display = plain ? 'none' : '';
    if (c.contains('new') || c.contains('changed') || c.contains('removed')) g.querySelectorAll('rect, polygon, path, circle, ellipse').forEach(sh => {
      if (plain) { sh.style.setProperty('fill', fill, 'important'); sh.style.setProperty('stroke', stroke, 'important'); }
      else { sh.style.removeProperty('fill'); sh.style.removeProperty('stroke'); }
    });
  });
}

// ---------------- Mermaid: renders only what is visible, and again when the theme changes ----------------
function renderMermaid(root, done) {
  if (!root || typeof mermaid === 'undefined') { if (done) done(); return; }
  const theme = isDark() ? 'dark' : 'default';
  const nodes = Array.from(root.querySelectorAll('.mmd')).filter(el => el.offsetParent !== null && el.dataset.theme !== theme);
  if (!nodes.length) { if (done) done(); return; }
  nodes.forEach(el => { el.removeAttribute('data-processed'); el.textContent = QX.mermaid[el.dataset.mid]; el.dataset.theme = theme; });
  mermaid.initialize({ startOnLoad: false, theme, sequence: { mirrorActors: false } });
  mermaid.run({ nodes }).catch(() => {}).then(() => { nodes.forEach(fixMermaidNotes); document.querySelectorAll('.dg.plain').forEach(mermaidPlain); if (done) done(); });
}

// ---------------- Guided tours ----------------
// D2 steps: {caption, highlight: [D2 ids], mark: [class tokens], lit: [class tokens]}, resolved by the build.
// Mermaid flowchart steps: {caption, highlight: [node ids]}. Mermaid sequence steps: {caption, highlight: [text of a participant, message or note]}.
const tourState = {};
function tourMove(vid, dir) {
  const v = VIEW_BY_ID[vid];
  if (!v || !v.tour.length) return;
  tourState[vid] = ((tourState[vid] || 0) + dir + v.tour.length) % v.tour.length;
  renderTourStep(vid);
}
function renderTourStep(vid) {
  const v = VIEW_BY_ID[vid];
  if (!v || !v.tour || !v.tour.length) return;
  const i = tourState[vid] || 0, step = v.tour[i], panel = document.getElementById('view-' + vid);
  panel.querySelector('.tour-caption').textContent = step.caption;
  panel.querySelector('.tour-step-label').textContent = (i + 1) + ' / ' + v.tour.length;
  let lit = 0;
  if (v.kind === 'd2') lit = highlightD2(panel, v, step);
  else if (v.seq) lit = highlightSeq(panel, step.highlight || []);
  else lit = highlightFlow(panel, step.highlight || []);
  panel.dataset.hl = lit;
}
function highlightD2(panel, v, step) {
  const all = new Set(v.tokens), keep = new Set(step.lit), mark = new Set(step.mark);
  panel.querySelectorAll('.dgv > svg').forEach(svg => {
    svg.classList.add('tour-on');
    svg.querySelectorAll('g[class]').forEach(g => {
      const tok = g.classList[0];
      if (!all.has(tok)) return;
      g.classList.toggle('dim', !keep.has(tok));
      g.classList.toggle('tour-hl', mark.has(tok));
    });
  });
  // The number of elements really lit, counted on the first diagram: it is zero when no id matched.
  const first = panel.querySelector('.dgv > svg');
  return first ? first.querySelectorAll('g.tour-hl').length : 0;
}
function highlightFlow(panel, ids) {
  const svg = panel.querySelector('.mmd svg');
  if (!svg) return 0;
  const want = new Set(ids), nodes = [];
  svg.querySelectorAll('g.node').forEach(g => {
    const m = g.id.match(/(?:^|-)(?:flowchart|state)-(.+?)-\d+$/);
    nodes.push({ g, hit: !!m && want.has(m[1]) });
  });
  const edgeHit = id => {
    const body = id.replace(/^.*?L_/, '').replace(/_\d+$/, '');
    for (let k = body.indexOf('_'); k > 0; k = body.indexOf('_', k + 1)) if (want.has(body.slice(0, k)) && want.has(body.slice(k + 1))) return true;
    return false;
  };
  const paths = Array.from(svg.querySelectorAll('path.flowchart-link, g.edgePaths path'));
  const labels = Array.from(svg.querySelectorAll('g.edgeLabels > g.edgeLabel, .edgeLabel'));
  let n = 0;
  nodes.forEach(x => { x.g.classList.toggle('dim', !x.hit); x.g.classList.toggle('tour-hl', x.hit); if (x.hit) n++; });
  paths.forEach((p, i) => {
    const hit = edgeHit(p.id || '');
    p.classList.toggle('dim', !hit);
    if (labels[i]) labels[i].classList.toggle('dim', !hit);
    if (hit) n++;
  });
  return n;
}
function highlightSeq(panel, ids) {
  const svg = panel.querySelector('.mmd svg');
  if (!svg) return 0;
  svg.querySelectorAll('.seq-highlight').forEach(el => el.classList.remove('seq-highlight'));
  let n = 0, first = null;
  svg.querySelectorAll('text.messageText, text.noteText, text.actor').forEach(t => {
    if (ids.some(id => t.textContent.includes(id))) { t.classList.add('seq-highlight'); n++; first = first || t; }
  });
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  return n;
}

// Mermaid sizes note boxes with fixed character widths, which are wrong for proportional fonts.
// Measure each note's real text and resize its box. Multi-line notes are sibling text.noteText elements.
function fixMermaidNotes(root) {
  const PAD_X = 14, PAD_Y = 8;
  const groups = new Map();
  (root || document).querySelectorAll('text.noteText').forEach(t => {
    const g = t.parentElement;
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(t);
  });
  groups.forEach((texts, g) => {
    const rect = g.querySelector('rect.note');
    if (!rect) return;
    const boxes = texts.map(t => { try { return t.getBBox(); } catch (e) { return null; } }).filter(Boolean);
    if (!boxes.length) return;
    const rx = parseFloat(rect.getAttribute('x') || 0), ry = parseFloat(rect.getAttribute('y') || 0);
    const lineH = boxes[0].height || 16;
    const w = Math.max(Math.max(...boxes.map(b => b.width)) + 2 * PAD_X, parseFloat(rect.getAttribute('width')) || 0);
    rect.setAttribute('width', w);
    rect.setAttribute('height', texts.length * lineH + 2 * PAD_Y);
    texts.forEach((t, i) => {
      t.setAttribute('x', rx + w / 2); t.setAttribute('y', ry + PAD_Y + lineH * (i + 0.5)); t.setAttribute('dy', '0');
      t.setAttribute('dominant-baseline', 'middle'); t.setAttribute('text-anchor', 'middle');
    });
  });
}

// ---------------- Theme and diagram style ----------------
function applyTheme(dark) {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.getElementById('theme-toggle').textContent = dark ? 'Light mode' : 'Dark mode';
}
function toggleTheme() {
  const dark = !isDark();
  lsSet('qexplain-theme', dark ? 'dark' : 'light');
  applyTheme(dark);
  // Mermaid draws with the theme it had at render time, so draw the visible diagrams again.
  renderMermaid(document.body, () => { if (currentVid) renderTourStep(currentVid); });
}
function applySketch(classic) {
  document.documentElement.setAttribute('data-sketch', classic ? 'classic' : 'sketch');
  document.getElementById('sketch-toggle').textContent = classic ? 'Sketch style' : 'Classic style';
}
function toggleSketch() {
  const classic = document.documentElement.getAttribute('data-sketch') !== 'classic';
  lsSet('qexplain-sketch', classic ? 'classic' : 'sketch');
  applySketch(classic);
}

// ---------------- Diff review ----------------
// Reviewed state lives under qexplain-diff-<slug>, the slug being the file name stem lowercased with _ as -.
const FILE_STEM = decodeURIComponent(location.pathname.split('/').pop() || 'explanation').replace(/\.html?$/i, '');
const STORE_KEY = 'qexplain-diff-' + FILE_STEM.toLowerCase().replace(/_/g, '-');
const TYPE_ORDER = [['src', 'Source'], ['test', 'Tests'], ['config', 'Configuration'], ['doc', 'Documentation'], ['generated', 'Generated'], ['other', 'Other']];
function fileType(p) {
  // Keep in step with file_type() in scripts/qexplain_diff.py.
  if (/(^|\/)(vendor|node_modules|dist|third_party)\/|\.min\.(js|css)$|\.generated\.|_generated\.|\.pb\.go$|(^|\/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|go\.sum|Cargo\.lock|poetry\.lock|composer\.lock|Gemfile\.lock|uv\.lock)$/i.test(p)) return 'generated';
  if (/(^|\/)(tests?|testing|__tests__|spec|testdata|test_data|fixtures?|__fixtures__|__snapshots__)\/|[._-](test|spec)\.[^/]+$|_test\.go$|(^|\/)test_[^/]+$|(^|\/)conftest\.py$|\.snap$/i.test(p) || /[a-z]Tests?\.(java|kt|cs|scala|swift|php)$/.test(p)) return 'test';
  if (/\.(md|mdx|rst|adoc|txt)$/i.test(p) || /(^|\/)(README|CHANGELOG|LICENSE)[^/]*$/i.test(p)) return 'doc';
  if (/\.(json|jsonc|ya?ml|toml|ini|cfg|conf|env|xml|lock|properties|gradle)$/i.test(p) || /(^|\/)(\.[^/]+|Dockerfile|Makefile|Procfile)$/i.test(p)) return 'config';
  if (/\.(go|py|js|jsx|ts|tsx|mjs|cjs|java|kt|kts|rs|c|cc|cpp|h|hpp|cs|rb|php|swift|scala|sh|bash|ps1|psm1|sql|html|css|scss|vue|svelte|lua|dart)$/i.test(p)) return 'src';
  return 'other';
}
function parseDiff(raw) {
  const files = []; let cur = null, inHunk = false;
  for (const line of raw.split('\n')) {
    if (line.startsWith('diff --git ')) {
      if (cur) files.push(cur);
      inHunk = false;
      // 'a/X b/X': split at the midpoint, because X may itself hold ' b/'.
      const rest = line.slice(11), mid = (rest.length - 1) / 2;
      const same = Number.isInteger(mid) && rest[mid] === ' ' && rest.slice(2, mid) === rest.slice(mid + 3);
      const m = line.match(/^diff --git a\/(.*) b\/(.*)$/);
      const parsed = (QX.paths || [])[files.length];  // the build's parsed path, which also decodes quoted names
      cur = { path: parsed || (same ? rest.slice(mid + 3) : (m ? m[2] : rest)), lines: [], add: 0, del: 0, isNew: false, isDel: false, binary: false, renamedFrom: null };
    } else if (cur) {
      if (line.startsWith('@@')) inHunk = true;
      if (!inHunk) {
        if (line.startsWith('new file')) cur.isNew = true;
        else if (line.startsWith('deleted file')) cur.isDel = true;
        else if (line.startsWith('rename from ')) cur.renamedFrom = line.slice(12);
        else if (line.startsWith('Binary files ')) cur.binary = true;
        else if (line.startsWith('+++ b/') && !(QX.paths || [])[files.length]) cur.path = line.slice(6).replace(/\t$/, '');
      } else if (line.startsWith('+')) cur.add++;
      else if (line.startsWith('-')) cur.del++;
      cur.lines.push(line);
    }
  }
  if (cur) files.push(cur);
  return files;
}
function splitDiff(lines) {
  const L = [], R = []; let ln = 1, rn = 1, inHunk = false;
  for (const line of lines) {
    if (line.startsWith('@@')) {
      const m = line.match(/@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
      if (m) { ln = +m[1]; rn = +m[2]; }
      inHunk = true;
      const h = { t: 'h', ln: '', c: line }; L.push(h); R.push(h); continue;
    }
    if (!inHunk || line.startsWith('\\')) continue;
    if (line.startsWith('-')) { L.push({ t: 'del', ln: ln++, c: line.slice(1) }); R.push({ t: 'del', ln: '', c: '' }); }
    else if (line.startsWith('+')) { L.push({ t: 'add', ln: '', c: '' }); R.push({ t: 'add', ln: rn++, c: line.slice(1) }); }
    else { L.push({ t: '', ln: ln++, c: line.slice(1) }); R.push({ t: '', ln: rn++, c: line.slice(1) }); }
  }
  return { L, R };
}
function renderPane(rows, path) {
  let h = '<table class="dt"><colgroup><col class="lnc"><col></colgroup><tbody>';
  for (const r of rows) {
    if (r.t === 'h') { h += '<tr class="hunk"><td class="ln">&hellip;</td><td>' + esc(r.c) + '</td></tr>'; continue; }
    h += '<tr class="' + r.t + '" data-path="' + esc(path) + '"' + (r.ln !== '' ? ' data-ln="' + r.ln + '"' : '') + '>'
      + '<td class="ln">' + r.ln + '</td><td>' + (esc(r.c) || '&nbsp;') + '</td></tr>';
  }
  return h + '</tbody></table>';
}

const allFiles = parseDiff(QX.rawDiff);
const fmap = Object.fromEntries(allFiles.map(f => [f.path, f]));
const GROUPS = TYPE_ORDER.map(([f, label]) => ({ f, label, files: allFiles.filter(x => fileType(x.path) === f).map(x => x.path) })).filter(g => g.files.length);
const ordered = GROUPS.flatMap(g => g.files);
let ST = {};
try { ST = JSON.parse(lsGet(STORE_KEY) || '{}'); } catch (e) {}
let activeF = 'all', curIdx = -1, navMode = 'group', navLocked = false, navLockTimer = null;
const baseTitle = document.title;
function saveS() { lsSet(STORE_KEY, JSON.stringify(ST)); upProg(); }
function upProg() {
  const r = ordered.filter(p => ST[p]).length;
  document.getElementById('rc').textContent = r;
  document.getElementById('tc').textContent = ordered.length;
  document.title = '[' + r + '/' + ordered.length + '] ' + baseTitle;
}
function diffActive() { const p = document.getElementById('part-diff'); return !!p && p.classList.contains('active'); }
function measureHeader() {
  const bar = document.getElementById('top-bar'), hdr = document.getElementById('header');
  document.documentElement.style.setProperty('--part-bar-h', bar.offsetHeight + 'px');
  if (hdr.offsetHeight) document.documentElement.style.setProperty('--header-h', hdr.offsetHeight + 'px');
}
function headerBottom() { return document.getElementById('top-bar').offsetHeight + document.getElementById('header').offsetHeight; }

function ensureDiff() {
  if (window._diffBuilt) { measureHeader(); return; }
  window._diffBuilt = true;
  document.getElementById('filter-group').innerHTML = '<button class="fbtn on" onclick="setF(\'all\',this)">All</button>'
    + GROUPS.map(g => '<button class="fbtn" onclick="setF(\'' + g.f + '\',this)">' + esc(g.label) + '</button>').join('')
    + '<button class="fbtn" onclick="setF(\'ur\',this)">Unreviewed</button>';
  renderExcluded(); buildNav(); buildFiles(); initNavResize(); measureHeader();
}
// Files left out of the page: their names, counts and reasons only.
function renderExcluded() {
  const items = QX.excluded || [];
  if (!items.length) return;
  document.getElementById('excluded-note').innerHTML = '<div class="callout"><strong>Left out of this page.</strong> Review these yourself in a terminal. If a path starts with a repo label, leave the label out there.<ul>'
    + items.map(x => '<li><code style="overflow-wrap:anywhere">' + esc(x.path) + '</code> +' + x.add + ' -' + x.del + ' (' + esc(x.reason || 'left out') + ')</li>').join('') + '</ul></div>';
}
// Copies every file note as Markdown, ready to paste into a merge request or a follow-up list.
function copyNotes() {
  const noted = ordered.filter(p => (ST[p + '__n'] || '').trim());
  if (!noted.length) { showToast('No notes yet'); return; }
  const reviewed = ordered.filter(p => ST[p]).length;
  const lines = ['# Review notes: ' + baseTitle, '', 'Base: ' + QX.base + '. Head: ' + QX.head + '. Reviewed ' + reviewed + ' of ' + ordered.length + ' files.', ''];
  noted.forEach(p => lines.push('- `' + p + '`' + (ST[p] ? ' (reviewed)' : '') + ': ' + ST[p + '__n'].trim().replace(/\n/g, '\n  ')));
  copyText(lines.join('\n') + '\n', 'Copied notes on ' + noted.length + ' files', document.getElementById('copy-notes'));
}
function setNavView(v, btn) {
  navMode = v;
  document.querySelectorAll('.nvbtn').forEach(b => b.classList.toggle('on', b === btn));
  buildNav();
}
function navItem(p, label) {
  const f = fmap[p];
  return '<a class="ni' + (ST[p] ? ' rv' : '') + '" data-p="' + esc(p) + '" href="#" onclick="event.preventDefault();jumpTo(\'' + jsq(p) + '\')">'
    + '<div class="dot"></div><span class="nfn" title="' + esc(p) + '">' + esc(label) + '</span><div class="nbadge">'
    + (f.add ? '<span class="b ba">+' + f.add + '</span>' : '') + (f.del ? '<span class="b bd">-' + f.del + '</span>' : '') + '</div></a>';
}
function buildNav() {
  let h = '';
  if (navMode === 'group') {
    GROUPS.forEach((g, gi) => {
      h += '<div class="ng" id="ng' + gi + '"><div class="ng-label" onclick="this.parentElement.classList.toggle(\'collapsed\')"><span>' + esc(g.label)
        + ' (' + g.files.length + ')</span><span class="ci">&#9660;</span></div><div class="ni-wrap">'
        + g.files.map(p => navItem(p, p.split('/').slice(-2).join('/'))).join('') + '</div></div>';
    });
  } else {
    const root = {};
    allFiles.forEach(f => { let n = root; const pts = f.path.split('/'); pts.slice(0, -1).forEach(d => { n = n[d] = n[d] || { __dir: {} }; n = n.__dir; }); n[pts[pts.length - 1]] = f; });
    const walk = (obj) => {
      let out = '';
      Object.keys(obj).filter(k => obj[k].__dir).sort().forEach(k => {
        const paths = collect(obj[k].__dir);
        out += '<div class="tdir" onclick="this.classList.toggle(\'col\')" data-paths="' + esc(JSON.stringify(paths)) + '"><span class="tdir-ci">&#9660;</span>'
          + '<div class="tdir-dot"></div><span class="tdir-name">' + esc(k) + '/</span></div><div class="tch">' + walk(obj[k].__dir) + '</div>';
      });
      Object.keys(obj).filter(k => obj[k].path).sort().forEach(k => { out += navItem(obj[k].path, k); });
      return out;
    };
    const collect = (obj) => Object.values(obj).flatMap(v => v.path ? [v.path] : collect(v.__dir));
    h = walk(root);
  }
  document.getElementById('nav-inner').innerHTML = h;
  refreshTreeDots();
}
// A directory dot is green only when every file beneath it, at any depth, is reviewed.
function refreshTreeDots() {
  document.querySelectorAll('.tdir').forEach(d => {
    const paths = JSON.parse(d.dataset.paths);
    d.querySelector('.tdir-dot').classList.toggle('all-rv', paths.length > 0 && paths.every(p => ST[p]));
  });
}
function buildFiles() {
  let h = '';
  GROUPS.forEach(g => g.files.forEach(p => {
    const f = fmap[p], rv = !!ST[p], col = !!(ST[p] || ST[p + '__col']), q = jsq(p);
    h += '<div class="fc' + (rv ? ' rv' : '') + (col ? ' iscol' : '') + '" data-p="' + esc(p) + '" data-g="' + g.f + '">'
      + '<div class="fh" onclick="toggleC(\'' + q + '\')"><button class="colbtn" title="Collapse">&#9660;</button>'
      + '<span class="ft" title="' + esc(p) + '">' + esc(p) + '</span><div class="fstats">'
      + (f.add ? '<span class="b ba">+' + f.add + '</span>' : '') + (f.del ? '<span class="b bd">-' + f.del + '</span>' : '')
      + (f.isNew ? '<span class="b bn">NEW</span>' : '') + (f.isDel ? '<span class="b bd">DEL</span>' : '') + '</div>'
      + '<button class="rbtn" onclick="event.stopPropagation();toggleR(\'' + q + '\')">' + (rv ? 'Reviewed' : 'Mark reviewed') + '</button></div>'
      + '<div class="rat">' + esc(QX.rationales[p] || 'No rationale recorded.') + '</div>'
      + '<textarea class="notearea" placeholder="Add a file note" oninput="ST[\'' + q + '__n\']=this.value;saveS()">' + esc(ST[p + '__n'] || '') + '</textarea>'
      + '<div class="db' + (col ? ' col' : '') + '">';
    const hasHunks = f.lines.some(l => l.startsWith('@@'));
    if (f.binary) h += '<div class="file-msg">Binary file. No textual diff.</div>';
    else if (!hasHunks && f.renamedFrom) h += '<div class="file-msg">Renamed from ' + esc(f.renamedFrom) + ', no content change.</div>';
    else if (!hasHunks) h += '<div class="file-msg">No textual diff.</div>';
    else {
      if (f.renamedFrom) h += '<div class="file-msg">Renamed from ' + esc(f.renamedFrom) + '.</div>';
      const { L, R } = splitDiff(f.lines);
      h += '<div class="sp"><div class="pane">' + renderPane(L, p) + '</div><div class="pane">' + renderPane(R, p) + '</div></div>';
    }
    h += '</div></div>';
  }));
  document.getElementById('fc').innerHTML = h;
  upProg(); syncNavToScroll();
}
const card = p => document.querySelector('.fc[data-p="' + CSS.escape(p) + '"]');
const navEl = p => document.querySelector('.ni[data-p="' + CSS.escape(p) + '"]');
function toggleR(p) {
  ST[p] = !ST[p];
  const c = card(p), n = navEl(p);
  c.classList.toggle('rv', ST[p]); if (n) n.classList.toggle('rv', ST[p]);
  c.querySelector('.rbtn').textContent = ST[p] ? 'Reviewed' : 'Mark reviewed';
  toggleC(p, ST[p]);   // marking reviewed collapses; un-marking expands
  saveS();
  if (activeF === 'ur') filterFiles();
  refreshTreeDots();
}
function toggleC(p, force) {
  const c = card(p);
  const col = force !== undefined ? force : !c.classList.contains('iscol');
  c.classList.toggle('iscol', col); c.querySelector('.db').classList.toggle('col', col);
  ST[p + '__col'] = col; saveS();
}
function setF(f, btn) {
  activeF = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.toggle('on', b === btn));
  filterFiles();
}
function filterFiles() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.fc').forEach(c => {
    const p = c.dataset.p;
    const mf = activeF === 'all' || (activeF === 'ur' ? !ST[p] : c.dataset.g === activeF);
    c.classList.toggle('hide', !(mf && (!q || p.toLowerCase().includes(q))));
  });
  document.querySelectorAll('.ni').forEach(n => { const c = card(n.dataset.p); n.style.display = c && c.classList.contains('hide') ? 'none' : ''; });
}
function setActive(p) {
  document.querySelectorAll('.ni.on').forEach(e => e.classList.remove('on'));
  const n = navEl(p);
  if (n) { n.classList.add('on'); n.scrollIntoView({ block: 'nearest' }); }
  curIdx = ordered.indexOf(p);
}
function jumpTo(p) {
  const c = card(p);
  if (!c) return;
  c.scrollIntoView({ behavior: 'smooth', block: 'start' });
  setActive(p);
  navLocked = true; clearTimeout(navLockTimer);
  navLockTimer = setTimeout(() => { navLocked = false; syncNavToScroll(); }, 700);
}
const visibleFiles = () => ordered.filter(p => { const c = card(p); return c && !c.classList.contains('hide'); });
function navFile(dir) {
  const vis = visibleFiles();
  if (!vis.length) return;
  const i = vis.indexOf(ordered[curIdx]);
  jumpTo(vis[Math.max(0, Math.min(vis.length - 1, i < 0 ? 0 : i + dir))]);
}
// Hunks are counted from the left pane only; each hunk header appears in both panes.
function navHunk(dir) {
  const top = headerBottom() + 8;
  const hunks = visibleFiles().filter(p => !card(p).classList.contains('iscol'))
    .flatMap(p => Array.from(card(p).querySelectorAll('.sp .pane:first-child tr.hunk')).map(el => ({ el, p })));
  if (!hunks.length) return;
  const y = h => h.el.getBoundingClientRect().top;
  let target = dir > 0 ? hunks.find(h => y(h) > top + 4) : [...hunks].reverse().find(h => y(h) < top - 4);
  if (!target) target = dir > 0 ? hunks[hunks.length - 1] : hunks[0];
  window.scrollTo({ top: y(target) + window.scrollY - top, behavior: 'smooth' });
  setActive(target.p);
}
function syncNavToScroll() {
  if (navLocked || !diffActive()) return;
  const top = headerBottom() + 20;
  let best = null;
  for (const c of document.querySelectorAll('.fc:not(.hide)')) {
    if (c.getBoundingClientRect().top <= top) best = c.dataset.p; else { if (!best) best = c.dataset.p; break; }
  }
  if (best) setActive(best);
}
function initNavResize() {
  const MIN_W = 160, MAX_W = 560, DEFAULT_W = 290, KEY = 'nav-w';
  const resizer = document.getElementById('nav-resizer'), nav = document.getElementById('nav');
  const setW = w => document.documentElement.style.setProperty('--nav-w', Math.max(MIN_W, Math.min(MAX_W, w)) + 'px');
  const saved = parseInt(lsGet(KEY), 10);
  if (saved) setW(saved);
  resizer.addEventListener('mousedown', e => {
    e.preventDefault();
    const startX = e.clientX, startW = nav.getBoundingClientRect().width;
    resizer.classList.add('dragging'); document.body.style.userSelect = 'none';
    const onMove = ev => setW(startW + ev.clientX - startX);
    const onUp = () => {
      resizer.classList.remove('dragging'); document.body.style.userSelect = '';
      lsSet(KEY, Math.round(nav.getBoundingClientRect().width));
      document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
  });
  resizer.addEventListener('dblclick', () => { setW(DEFAULT_W); lsDel(KEY); });
}
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
function copyText(text, msg, btn) {
  navigator.clipboard.writeText(text).then(() => {
    if (btn) { btn.classList.add('copied'); setTimeout(() => btn.classList.remove('copied'), 1500); }
    showToast(msg);
  }).catch(() => showToast('Copy failed'));
}
function copyRef(which) { const v = which === 'base' ? QX.base : QX.head; copyText(v, 'Copied: ' + v, document.getElementById('hcp-' + which)); }
// Click a diff cell to toggle the row between truncated and wrapped.
document.addEventListener('click', e => {
  const td = e.target.closest('table.dt tr:not(.hunk) td');
  if (!td || (window.getSelection() || '').toString()) return;
  td.closest('tr').querySelectorAll('td:not(.ln)').forEach(c => c.classList.toggle('expanded'));
});
// Selecting text in the diff copies it with a "// file: <path>, line: <n>" header.
document.addEventListener('mouseup', () => {
  const sel = window.getSelection(), txt = sel ? sel.toString() : '';
  if (!diffActive() || txt.length < 2) return;
  const rowOf = node => { const el = node && (node.nodeType === 3 ? node.parentElement : node); return el ? el.closest('#main tr[data-path]') : null; };
  const row = rowOf(sel.anchorNode) || rowOf(sel.focusNode);
  if (!row) return;
  const ref = 'file: ' + row.dataset.path + (row.dataset.ln ? ', line: ' + row.dataset.ln : '');
  copyText('// ' + ref + '\n' + txt, 'Copied (' + ref + ')');
});
// Keys act only on the Diff review part, and never while typing or with a modifier held (Ctrl+C stays copy).
document.addEventListener('keydown', e => {
  if (!diffActive() || e.ctrlKey || e.metaKey || e.altKey || /^(TEXTAREA|INPUT)$/.test(e.target.tagName)) return;
  const cur = ordered[curIdx];
  if (e.key === 'j') navHunk(1);
  else if (e.key === 'k') navHunk(-1);
  else if (e.key === 'J') navFile(1);
  else if (e.key === 'K') navFile(-1);
  else if (e.key === 'm' && cur) toggleR(cur);
  else if (e.key === 'c' && cur) toggleC(cur);
  else return;
  e.preventDefault();
});
let scrollRaf = null;
window.addEventListener('scroll', () => { if (!scrollRaf) scrollRaf = requestAnimationFrame(() => { scrollRaf = null; syncNavToScroll(); }); }, { passive: true });
window.addEventListener('resize', () => { if (diffActive()) measureHeader(); });

// Click a diagram to read it full window. Escape, the Close button or a click outside the diagram closes it.
function openOverlay(svg) {
  const c = svg.cloneNode(true);
  c.removeAttribute('style'); c.removeAttribute('width'); c.removeAttribute('height');
  const body = document.getElementById('dg-ov-body');
  body.innerHTML = ''; body.appendChild(c);
  document.getElementById('dg-overlay').hidden = false;
}
function closeOverlay() { document.getElementById('dg-overlay').hidden = true; document.getElementById('dg-ov-body').innerHTML = ''; }
document.addEventListener('click', e => {
  if (e.target.closest('#dg-overlay')) { if (e.target.id === 'dg-overlay' || e.target.id === 'dg-close') closeOverlay(); return; }
  if ((window.getSelection() || '').toString()) return;
  const dgv = e.target.closest('.dgv'), mm = e.target.closest('.dg .mmd');
  const svg = dgv ? dgv.querySelector(':scope > svg') : (mm ? mm.querySelector('svg') : null);
  if (svg) openOverlay(svg);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('dg-overlay').hidden) closeOverlay(); });

// A change summary row opens its file in Diff review.
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-file]');
  if (!a) return;
  e.preventDefault();
  switchPart('diff');
  jumpTo(a.dataset.file);
});

// ---------------- Start ----------------
window.addEventListener('DOMContentLoaded', () => {
  applyTheme(isDark());
  applySketch(document.documentElement.getAttribute('data-sketch') === 'classic');
  if (QX.hasD2) document.getElementById('sketch-toggle').hidden = false;
  switchPart(PART_KEYS[0], false);
  restoreFromHash();
});
window.addEventListener('popstate', restoreFromHash);
</script>
