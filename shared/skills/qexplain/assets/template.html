<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<!--
  /qexplain artifact template. Do not edit this file per artifact.
  scripts/build-explanation.py fills the double-brace placeholders and the NARRATIVE, MAPS,
  SUMMARY and DATA slots. Everything after the DATA slot is fixed code shared by every artifact.
-->
<script>
  // Apply the stored theme before first paint, so a dark-mode reader never sees a light flash.
  try { if (localStorage.getItem('qexplain-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<style>
  /* ---- Theme variables ---- */
  :root {
    --bg: #fafafa; --surface: #fff; --text: #1a1a1a; --text-light: #546e7a;
    --border: #ddd; --border-strong: #ccc; --pre-bg: #f0f0f0;
    --callout-bg: #f0f6ff; --callout-border: #0066cc;
    --link: #0066cc; --btn-bg: #f7f7f7;
    --cy-bg: #f7f9fc; --cy-border: #e0e0e0;
    --toggle-bg: #e0e0e0; --toggle-text: #333;
    --part-bar-h: 43px;
  }
  [data-theme="dark"] {
    --bg: #1a1a1a; --surface: #242424; --text: #e8e8e8; --text-light: #90a4ae;
    --border: #3a3a3a; --border-strong: #4a4a4a; --pre-bg: #2a2a2a;
    --callout-bg: #1a2a3a; --callout-border: #4a8ac4;
    --link: #64b5f6; --btn-bg: #2e2e2e;
    --cy-bg: #1e2430; --cy-border: #3a3a3a;
    --toggle-bg: #3a3a3a; --toggle-text: #e0e0e0;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.6; color: var(--text); background: var(--bg); margin: 0; padding: 0;
  }
  .theme-toggle {
    position: fixed; top: 0.5rem; right: 1rem; z-index: 200;
    padding: 0.25rem 0.6rem; border-radius: 4px; border: 1px solid var(--border-strong);
    background: var(--toggle-bg); color: var(--toggle-text); font-size: 0.82rem; cursor: pointer; user-select: none;
  }
  .theme-toggle:hover { opacity: 0.8; }
  .page { max-width: 780px; margin: 0 auto; padding: 0 1.5rem 4rem; }
  body.wide-part .page { max-width: min(1700px, 96vw); }
  h1 { font-size: 1.5rem; margin-top: 2rem; margin-bottom: 0.25rem; }
  h2 { font-size: 1.15rem; margin-top: 2rem; }
  h3 { font-size: 1rem; margin-top: 1.5rem; color: var(--text-light); }
  p { margin: 0.75rem 0; }
  a { color: var(--link); }
  img, svg, video { max-width: 100%; }
  pre {
    background: var(--pre-bg); border-left: 3px solid var(--border-strong); padding: 0.75rem 1rem;
    overflow-x: auto; font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap; border-radius: 3px;
  }
  code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 0.9em; background: var(--pre-bg); padding: 0.1em 0.3em; border-radius: 2px; white-space: pre-wrap; }
  .callout { border-left: 4px solid var(--callout-border); background: var(--callout-bg); padding: 0.75rem 1rem; margin: 1rem 0; border-radius: 0 4px 4px 0; font-size: 0.95rem; }
  .callout.warn { border-color: #cc8800; }
  /* Part bar */
  .part-bar { position: sticky; top: 0; background: var(--surface); border-bottom: 2px solid var(--border); z-index: 100; display: flex; flex-wrap: wrap; padding: 0 6rem 0 1.5rem; }
  .part-btn { padding: 0.6rem 1.2rem; border: none; background: none; cursor: pointer; font-size: 0.9rem; font-weight: 500; color: var(--text-light); border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .part-btn.active { color: var(--link); border-bottom-color: var(--link); }
  .part-panel { display: none; }
  .part-panel.active { display: block; }
  /* Map tabs */
  .map-bar { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; padding-top: 1rem; }
  .map-btn { padding: 0.35rem 0.8rem; border: 1px solid var(--border-strong); border-radius: 3px; background: var(--btn-bg); cursor: pointer; font-size: 0.82rem; color: var(--text); }
  .map-btn.active { background: var(--link); color: #fff; border-color: var(--link); }
  .map-panel { display: none; }
  .map-panel.active { display: block; }
  .map-note { font-size: 0.85rem; color: var(--text-light); font-style: italic; }
  .cy-wrap { width: 100%; height: 600px; border: 1px solid var(--cy-border); border-radius: 4px; background: var(--cy-bg); }
  .fit-btn { font-size: 0.78rem; padding: 0.2rem 0.5rem; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); border-radius: 3px; cursor: pointer; margin-bottom: 0.3rem; }
  /* System-overview component cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.8rem; }
  .card { border: 1px solid var(--border-strong); border-radius: 6px; padding: 0.7rem 0.9rem; background: var(--surface); }
  .card h4 { margin: 0 0 0.3rem; font-size: 0.95rem; }
  .card p { margin: 0; font-size: 0.88rem; }
  .card.highlighted { border-color: #f57c00; box-shadow: 0 0 0 2px #f57c00; }
  /* Tour */
  .tour-box { display: flex; align-items: center; gap: 0.5rem; background: var(--btn-bg); border: 1px solid var(--border); border-radius: 4px; padding: 0.5rem 0.75rem; margin-top: 0.6rem; font-size: 0.88rem; }
  .tour-box button { padding: 0.2rem 0.6rem; border: 1px solid var(--border-strong); border-radius: 3px; background: var(--surface); color: var(--text); cursor: pointer; font-size: 0.82rem; }
  .tour-caption { flex: 1; }
  .tour-step-label { color: var(--text-light); font-size: 0.8rem; white-space: nowrap; }
  .seq-highlight { outline: 2px solid #f57c00 !important; outline-offset: 3px; }
  text.seq-highlight { fill: #f57c00 !important; font-weight: bold; }
  /* Change summary */
  table { border-collapse: collapse; width: 100%; font-size: 0.88rem; margin: 1rem 0; }
  th { background: var(--pre-bg); text-align: left; padding: 0.4rem 0.6rem; border-bottom: 2px solid var(--border-strong); }
  td { padding: 0.35rem 0.6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  .table-wrap { overflow-x: auto; }
  .mermaid { margin: 1.5rem 0; overflow-x: auto; }

  /* ===== Diff review ===== */
  :root { --nav-w: 290px; --header-h: 56px; }
  #part-diff, [data-theme="dark"] #part-diff { --bg:#0d1117; --surface:#161b22; --border:#30363d; --text:#c9d1d9; --muted:#8b949e; --accent:#58a6ff; --add-bg:#0d4429; --add-fg:#3fb950; --del-bg:#67060c; --del-fg:#f85149; --hunk-bg:#1c2d3a; --hunk-fg:#79c0ff; --rv-bg:rgba(63,185,80,.06); }
  html:not([data-theme="dark"]) #part-diff { --bg:#f6f8fa; --surface:#fff; --border:#d0d7de; --text:#1f2328; --muted:#57606a; --accent:#0969da; --add-bg:#e6ffec; --add-fg:#1a7f37; --del-bg:#ffebe9; --del-fg:#cf222e; --hunk-bg:#ddf4ff; --hunk-fg:#0550ae; --rv-bg:rgba(26,127,55,.05); }
  #part-diff { background: var(--bg); color: var(--text); font-size: 13px; min-height: 100vh; }
  #header { position: fixed; top: var(--part-bar-h); left: 0; right: 0; min-height: 56px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 6px 16px; gap: 10px 12px; z-index: 90; flex-wrap: wrap; }
  #header h1 { font-size: 14px; font-weight: 700; margin: 0; }
  #search { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 6px; width: 180px; font-size: 12px; }
  #search:focus { outline: none; border-color: var(--accent); }
  #filter-group { display: flex; gap: 5px; flex-wrap: wrap; }
  .fbtn { background: var(--bg); border: 1px solid var(--border); color: var(--muted); padding: 3px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; }
  .fbtn:hover, .fbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #progress { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .kbd { display: inline-block; background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; font-family: monospace; font-size: 10px; color: var(--muted); }
  .nbtn { background: var(--bg); border: 1px solid var(--border); color: var(--muted); padding: 3px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; white-space: nowrap; }
  .nbtn:hover { border-color: var(--accent); color: var(--accent); }
  .hashpill { display: inline-flex; align-items: center; gap: 5px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 2px 8px 2px 10px; font-family: monospace; font-size: 11px; max-width: 260px; overflow: hidden; }
  .hashpill span { color: var(--muted); }
  .hashpill b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hcpbtn { background: none; border: 1px solid var(--border); border-radius: 3px; cursor: pointer; color: var(--muted); font-size: 10px; padding: 0 4px; }
  .hcpbtn:hover { color: var(--accent); } .hcpbtn.copied { color: var(--add-fg); }
  #navview { display: flex; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .nvbtn { background: var(--bg); border: none; color: var(--muted); padding: 3px 9px; font-size: 11px; cursor: pointer; }
  .nvbtn.on { background: var(--accent); color: #fff; }
  #nav { position: fixed; top: calc(var(--part-bar-h) + var(--header-h)); left: 0; bottom: 0; width: var(--nav-w); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--border); padding: 8px 0; z-index: 50; }
  #nav-resizer { position: fixed; top: calc(var(--part-bar-h) + var(--header-h)); left: var(--nav-w); bottom: 0; width: 5px; cursor: col-resize; z-index: 60; }
  #nav-resizer:hover, #nav-resizer.dragging { background: var(--accent); }
  .ng-label { padding: 6px 12px 3px; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; cursor: pointer; display: flex; justify-content: space-between; user-select: none; }
  .ci { font-size: 9px; transition: transform .15s; }
  .ng.collapsed .ci { transform: rotate(-90deg); }
  .ng.collapsed .ni-wrap { display: none; }
  .ni { display: flex; align-items: center; gap: 6px; padding: 5px 12px 5px 16px; cursor: pointer; text-decoration: none; color: var(--muted); border-left: 2px solid transparent; }
  .ni:hover { color: var(--text); }
  .ni.on { background: rgba(88,166,255,.08); color: var(--accent); border-left-color: var(--accent); }
  .ni.rv { border-left-color: var(--add-fg); }
  .nfn { flex: 1; font-family: monospace; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nbadge { display: flex; gap: 4px; }
  .b { padding: 1px 5px; border-radius: 3px; font-size: 10px; font-weight: 600; font-family: monospace; }
  .ba { background: rgba(63,185,80,.15); color: var(--add-fg); }
  .bd { background: rgba(248,81,73,.15); color: var(--del-fg); }
  .bn { background: rgba(88,166,255,.15); color: var(--accent); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
  .rv .dot { background: var(--add-fg); }
  .tdir { display: flex; align-items: center; gap: 4px; padding: 4px 8px 4px 12px; cursor: pointer; font-size: 11px; color: var(--muted); user-select: none; }
  .tdir-name { font-family: monospace; color: var(--text); }
  .tdir-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
  .tdir-dot.all-rv { background: var(--add-fg); }
  .tdir-ci { font-size: 9px; transition: transform .15s; }
  .tdir.col > .tdir-ci { transform: rotate(-90deg); }
  .tdir.col + .tch { display: none; }
  .tch { padding-left: 14px; border-left: 1px solid var(--border); margin-left: 16px; }
  #main { margin-left: var(--nav-w); padding: calc(var(--part-bar-h) + var(--header-h) + 20px) 24px 20px; }
  .fc { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; overflow: hidden; scroll-margin-top: calc(var(--part-bar-h) + var(--header-h) + 8px); }
  .fc.rv { border-color: var(--add-fg); background: var(--rv-bg); }
  .fc.hide { display: none; }
  .fh { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
  .ft { font-family: monospace; font-size: 12px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fstats { display: flex; gap: 6px; align-items: center; }
  .rbtn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 3px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; white-space: nowrap; }
  .rbtn:hover { border-color: var(--add-fg); color: var(--add-fg); }
  .rv .rbtn { background: rgba(63,185,80,.15); border-color: var(--add-fg); color: var(--add-fg); }
  .colbtn { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px; transition: transform .15s; }
  .fc.iscol > .fh > .colbtn { transform: rotate(-90deg); }
  .rat { padding: 8px 14px 6px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); }
  .notearea { background: transparent; border: none; border-bottom: 1px dashed var(--border); color: var(--text); font-size: 11px; width: 100%; resize: vertical; padding: 5px 14px; font-family: inherit; min-height: 26px; }
  .notearea:focus { outline: none; border-bottom-color: var(--accent); }
  .db.col { display: none; }
  .sp { display: grid; grid-template-columns: 1fr 1fr; }
  .pane { overflow-x: auto; }
  .pane + .pane { border-left: 2px solid var(--border); }
  table.dt { width: 100%; border-collapse: collapse; margin: 0; font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; font-size: 11.5px; table-layout: fixed; }
  table.dt col.lnc { width: 46px; }
  table.dt td { padding: 0 8px; white-space: pre; vertical-align: top; border: none; line-height: 1.65; overflow: hidden; text-overflow: ellipsis; cursor: text; }
  table.dt td.expanded { white-space: pre-wrap; overflow: visible; text-overflow: clip; }
  table.dt td.ln { color: var(--muted); text-align: right; font-size: 10px; padding: 0 6px; border-right: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; overflow: visible; }
  tr.add td { background: var(--add-bg); } tr.add td.ln { color: var(--add-fg); }
  tr.del td { background: var(--del-bg); } tr.del td.ln { color: var(--del-fg); }
  tr.hunk td { background: var(--hunk-bg); color: var(--hunk-fg); font-style: italic; }
  .file-msg { padding: 16px 20px; color: var(--muted); font-size: 12px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px); background: #333; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 12px; z-index: 9999; pointer-events: none; transition: transform .25s, opacity .25s; opacity: 0; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  @media (max-width: 760px) {
    .page { padding: 0 1rem 3rem; }
    .part-bar { padding: 0 5.5rem 0 0.5rem; }
    .part-btn { padding: 0.5rem 0.6rem; }
    #header { position: static; }
    #nav, #nav-resizer { display: none; }
    #main { margin-left: 0; padding: 12px; }
    .sp { grid-template-columns: 1fr; }
    .pane + .pane { border-left: none; border-top: 2px solid var(--border); }
  }
</style>
</head>
<body>

<div class="part-bar" id="top-bar">
  <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle dark/light mode">Theme</button>
  <button class="part-btn active" data-part="narrative" onclick="switchPart('narrative')">Narrative</button>
  <button class="part-btn" data-part="maps" onclick="switchPart('maps')">Maps</button>
  <button class="part-btn" data-part="summary" onclick="switchPart('summary')">Change summary</button>
  <button class="part-btn" data-part="diff" onclick="switchPart('diff')">Diff review</button>
</div>

<div id="part-narrative" class="part-panel active"><div class="page">
<!--@NARRATIVE-->
</div></div>

<div id="part-maps" class="part-panel"><div class="page">
<!--@MAPS-->
</div></div>

<div id="part-summary" class="part-panel"><div class="page">
<!--@SUMMARY-->
</div></div>

<div id="part-diff" class="part-panel">
  <div id="header">
    <h1>{{TITLE}}</h1>
    <div class="hashpill" title="{{BASE_REF}}"><span>base</span><b>{{BASE_REF}}</b><button class="hcpbtn" id="hcp-base" onclick="copyRef('base')" title="Copy">copy</button></div>
    <div class="hashpill" title="{{HEAD_REF}}"><span>head</span><b>{{HEAD_REF}}</b><button class="hcpbtn" id="hcp-head" onclick="copyRef('head')" title="Copy">copy</button></div>
    <input id="search" type="text" placeholder="Filter files" oninput="filterFiles()">
    <div id="navview"><button class="nvbtn on" onclick="setNavView('group', this)">Group</button><button class="nvbtn" onclick="setNavView('tree', this)">Tree</button></div>
    <div id="filter-group"></div>
    <div id="progress">Reviewed: <span id="rc">0</span>&thinsp;/&thinsp;<span id="tc">0</span></div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <button class="nbtn" onclick="navHunk(-1)">Prev hunk</button><button class="nbtn" onclick="navHunk(1)">Next hunk</button>
      <button class="nbtn" onclick="navFile(-1)">Prev file</button><button class="nbtn" onclick="navFile(1)">Next file</button>
      <span style="color:var(--muted);font-size:11px"><span class="kbd">j/k</span> hunk <span class="kbd">J/K</span> file <span class="kbd">m</span> mark <span class="kbd">c</span> collapse</span>
    </div>
  </div>
  <div id="nav"><div id="nav-inner"></div></div>
  <div id="nav-resizer" title="Drag to resize, double-click to reset"></div>
  <div id="main"><div id="fc"></div></div>
</div>
<div id="toast"></div>

<script>
/*@DATA*/

// ======================= Fixed code below: shared by every artifact =======================

const VIEWS = QX.views;                 // [{key, label, kind: 'graph'|'sequence'|'cards', ...}]
const VIEW_BY_KEY = Object.fromEntries(VIEWS.map(v => [v.key, v]));
const PART_KEYS = ['narrative', 'maps', 'summary', 'diff'];
const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function jsq(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

// ---------------- Part switching and URL hash (#part or #maps/view) ----------------
function switchPart(key, saveHash) {
  document.querySelectorAll('.part-panel').forEach(p => p.classList.toggle('active', p.id === 'part-' + key));
  document.querySelectorAll('.part-btn').forEach(b => b.classList.toggle('active', b.dataset.part === key));
  document.body.classList.toggle('wide-part', key !== 'narrative');
  if (key === 'maps') ensureMaps();
  if (key === 'summary' && !window._summaryRendered) {
    window._summaryRendered = true;
    const nodes = document.querySelectorAll('#part-summary .mermaid');
    if (nodes.length) mermaid.run({ nodes: Array.from(nodes) }).then(() => fixMermaidNotes(document.getElementById('part-summary')));
  }
  if (key === 'diff') ensureDiff();
  if (saveHash !== false) updateHash();
}
function updateHash() {
  const part = (document.querySelector('.part-btn.active') || {}).dataset.part;
  if (!part) return;
  const view = (document.querySelector('.map-btn.active') || {}).dataset;
  history.replaceState(null, '', '#' + part + (part === 'maps' && view ? '/' + view.view : ''));
}
function restoreFromHash() {
  const [part, view] = location.hash.replace('#', '').split('/');
  if (!PART_KEYS.includes(part)) return;
  switchPart(part, false);
  if (part === 'maps' && VIEW_BY_KEY[view]) setTimeout(() => switchMap(view, false), 200);
}

// ---------------- Maps ----------------
const CY_STYLE = [
  { selector: 'node', style: {
      'label': 'data(label)', 'text-valign': 'center', 'text-halign': 'center', 'text-wrap': 'wrap', 'text-max-width': '300px',
      'font-size': '12px', 'font-family': '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
      'width': 'data(w)', 'height': 'label', 'padding': '10px 14px', 'shape': 'roundrectangle',
      'background-color': '#eceff1', 'border-color': '#b0bec5', 'border-width': 1.5, 'color': '#1a1a1a' } },
  { selector: 'node[type="changed"]', style: { 'background-color': '#e3f2fd', 'border-color': '#1565c0', 'color': '#0d2d5e' } },
  { selector: 'node[type="new"]', style: { 'background-color': '#e8f5e9', 'border-color': '#1b5e20', 'color': '#0d3318' } },
  { selector: 'node.highlighted', style: { 'border-color': '#f57c00', 'border-width': 3 } },
  { selector: 'edge', style: {
      'curve-style': 'bezier', 'target-arrow-shape': 'triangle', 'target-arrow-color': '#78909c', 'line-color': '#78909c', 'width': 1.5,

function fixMermaidNotes(root) {

    if (!groups.has(g)) groups.set(g, []);

    if (!boxes.length) return;
    const rx = parseFloat(rect.getAttribute('x') || 0), ry = parseFloat(rect.getAttribute('y') || 0);

    const startX = e.clientX, startW = nav.getBoundingClientRect().width;
    resizer.classList.add('dragging'); document.body.style.userSelect = 'none';
    const onMove = ev => setW(startW + ev.clientX - startX);
    const onUp = () => {
      resizer.classList.remove('dragging'); document.body.style.userSelect = '';
      lsSet(KEY, Math.round(nav.getBoundingClientRect().width));
      document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
  });
  resizer.addEventListener('dblclick', () => { setW(DEFAULT_W); lsDel(KEY); });
}
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
function copyText(text, msg, btn) {
  navigator.clipboard.writeText(text).then(() => {
    if (btn) { btn.classList.add('copied'); setTimeout(() => btn.classList.remove('copied'), 1500); }
    showToast(msg);
  }).catch(() => showToast('Copy failed'));
}
function copyRef(which) { const v = which === 'base' ? QX.base : QX.head; copyText(v, 'Copied: ' + v, document.getElementById('hcp-' + which)); }
// Click a diff cell to toggle the row between truncated and wrapped.
document.addEventListener('click', e => {
  const td = e.target.closest('table.dt tr:not(.hunk) td');
  if (!td || (window.getSelection() || '').toString()) return;
  td.closest('tr').querySelectorAll('td:not(.ln)').forEach(c => c.classList.toggle('expanded'));
});
// Selecting text in the diff copies it with a "// file: <path>, line: <n>" header.
document.addEventListener('mouseup', () => {
  const sel = window.getSelection(), txt = sel ? sel.toString() : '';
  if (!diffActive() || txt.length < 2) return;
  const rowOf = node => { const el = node && (node.nodeType === 3 ? node.parentElement : node); return el ? el.closest('#main tr[data-path]') : null; };
  const row = rowOf(sel.anchorNode) || rowOf(sel.focusNode);
  if (!row) return;
  const ref = 'file: ' + row.dataset.path + (row.dataset.ln ? ', line: ' + row.dataset.ln : '');
  copyText('// ' + ref + '\n' + txt, 'Copied (' + ref + ')');
});
// Keys act only on the Diff review part, and never while typing or with a modifier held (Ctrl+C stays copy).
document.addEventListener('keydown', e => {
  if (!diffActive() || e.ctrlKey || e.metaKey || e.altKey || /^(TEXTAREA|INPUT)$/.test(e.target.tagName)) return;
  const cur = ordered[curIdx];
  if (e.key === 'j') navHunk(1);
  else if (e.key === 'k') navHunk(-1);
  else if (e.key === 'J') navFile(1);
  else if (e.key === 'K') navFile(-1);
  else if (e.key === 'm' && cur) toggleR(cur);
  else if (e.key === 'c' && cur) toggleC(cur);
  else return;
  e.preventDefault();
});
let scrollRaf = null;
window.addEventListener('scroll', () => { if (!scrollRaf) scrollRaf = requestAnimationFrame(() => { scrollRaf = null; syncNavToScroll(); }); }, { passive: true });
window.addEventListener('resize', () => { if (diffActive()) measureHeader(); });

// ---------------- Start ----------------
window.addEventListener('DOMContentLoaded', () => {
  mermaid.initialize({ startOnLoad: false, theme: isDark() ? 'dark' : 'default', sequence: { mirrorActors: false } });
  applyTheme(isDark());
  restoreFromHash();
});
window.addEventListener('popstate', restoreFromHash);
</script>
