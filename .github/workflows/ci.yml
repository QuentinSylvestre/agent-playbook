name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Windows is the main target, Linux is supported; macOS is not tested yet (README).
        os: [ubuntu-latest, windows-latest]
    steps:
      # Some fixture paths are longer than Windows' 260-character MAX_PATH: git needs long paths on.
      - name: Long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Setup runs for real into a throwaway home: --yes creates a local store repo seeded with
      # empty user memory, links the repo's memory to it, switches the checkout to the engine
      # branch and deploys every provider. The dry run before it must succeed and change nothing.
      - name: Setup (Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          HOME: ${{ runner.temp }}/home
          AGENT_PLAYBOOK_SKIP_KIRO_CLI: "1"
        run: |
          mkdir -p "$HOME"
          ./setup.sh --dry-run --yes
          test ! -e "$HOME/.agent-playbook/config"
          ./setup.sh --yes

      - name: Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          USERPROFILE: ${{ runner.temp }}\home
          APPDATA: ${{ runner.temp }}\home\AppData\Roaming
          AGENT_PLAYBOOK_SKIP_KIRO_CLI: "1"
        run: |
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE, $env:APPDATA | Out-Null
          .\setup.ps1 -DryRun -Yes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Test-Path (Join-Path $env:USERPROFILE '.agent-playbook\config')) { throw "the dry run wrote the pointer file" }
          .\setup.ps1 -Yes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Every guard and selftest, the leak scan and test-parity (both setup twins in sandboxes),
      # against the deployment above. PARTIAL (a platform-specific case skipped) passes under --ci.
      - name: Checks (Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          HOME: ${{ runner.temp }}/home
        run: .venv-agent-playbook/bin/python -I shared/skills/qconfig-sync/scripts/run-checks.py . --ci --work "$RUNNER_TEMP/checks" | tee "$RUNNER_TEMP/checks-summary.txt"

      - name: Checks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          USERPROFILE: ${{ runner.temp }}\home
          APPDATA: ${{ runner.temp }}\home\AppData\Roaming
        run: |
          .\.venv-agent-playbook\Scripts\python.exe -I shared\skills\qconfig-sync\scripts\run-checks.py . --ci --work "$env:RUNNER_TEMP\checks" | Tee-Object -FilePath "$env:RUNNER_TEMP\checks-summary.txt"
          exit $LASTEXITCODE

      # The output of every check that did not pass, in the log itself (the artifact below keeps it all).
      - name: Show failing check output
        if: failure()
        shell: bash
        run: |
          summary="$RUNNER_TEMP/checks-summary.txt"
          [ -f "$summary" ] || { echo "no check summary (setup failed before the checks ran)"; exit 0; }
          awk '$NF ~ /^(FAIL|COULD-NOT-RUN|TIMEOUT)$/ {print $1}' "$summary" | while read -r name; do
            for f in "$RUNNER_TEMP/checks/$name".out "$RUNNER_TEMP/checks/$name".err; do
              [ -s "$f" ] || continue
              echo "::group::$name ($(basename "$f"))"
              # no non-OK line is not an error: never let grep's exit 1 end the step under pipefail
              { grep -vE '^(OK|ok|PASS)([[:space:]]|$)' "$f" || true; } | head -150
              echo "::endgroup::"
            done
          done

      - name: Keep check output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.os }}
          path: ${{ runner.temp }}/checks
          if-no-files-found: ignore

      - name: Uninstall restores the home
        shell: bash
        if: runner.os != 'Windows'
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          printf '%s\n' '{"statusLine":{"command":"bash ~/.claude/statusline-command.sh"},"keep":1}' > "$HOME/.claude/settings.json"
          # A CLAUDE.md of your own: setup keeps it and links the playbook beside it in ~/.claude/rules.
          rm "$HOME/.claude/CLAUDE.md"
          printf 'mine\n' > "$HOME/.claude/CLAUDE.md"
          ./setup.sh --providers claude < /dev/null
          test -L "$HOME/.claude/rules/agent-playbook.md"
          test -L "$HOME/.claude/rules/playbook-user-memory.md"
          test -L "$HOME/.claude/rules/playbook-higher-order.md"
          ./setup.sh --uninstall --purge --providers all
          # test ! -e alone passes on a dangling link, so every removal is checked with ! -L too; one
          # test per line, as bash -e does not stop on a failure inside an && list
          test ! -L "$HOME/.claude/CLAUDE.md"
          test "$(cat "$HOME/.claude/CLAUDE.md")" = mine
          for f in agent-playbook.md playbook-user-memory.md playbook-higher-order.md; do
            test ! -e "$HOME/.claude/rules/$f"
            test ! -L "$HOME/.claude/rules/$f"
          done
          test ! -e "$HOME/.agent-playbook/config"
          grep -q '"keep": 1' "$HOME/.claude/settings.json"
          ! grep -q statusline-command "$HOME/.claude/settings.json"
