name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Setup runs for real into a throwaway home: --yes creates a local store repo seeded with
      # empty user memory, links the repo's memory to it, switches the checkout to the engine
      # branch and deploys every provider. The dry run before it must succeed and change nothing.
      - name: Setup (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          HOME: ${{ runner.temp }}/home
          AGENT_PLAYBOOK_SKIP_KIRO_CLI: "1"
        run: |
          mkdir -p "$HOME"
          ./setup.sh --dry-run --yes
          test ! -e "$HOME/.agent-playbook/config"
          ./setup.sh --yes

      - name: Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          USERPROFILE: ${{ runner.temp }}\home
          APPDATA: ${{ runner.temp }}\home\AppData\Roaming
          AGENT_PLAYBOOK_SKIP_KIRO_CLI: "1"
        run: |
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE, $env:APPDATA | Out-Null
          .\setup.ps1 -DryRun -Yes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Test-Path (Join-Path $env:USERPROFILE '.agent-playbook\config')) { throw "the dry run wrote the pointer file" }
          .\setup.ps1 -Yes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Every guard and selftest, the leak scan and test-parity (both setup twins in sandboxes),
      # against the deployment above. PARTIAL (a platform-specific case skipped) passes under --ci.
      - name: Checks (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          HOME: ${{ runner.temp }}/home
        run: .venv-agent-playbook/bin/python -I shared/skills/qconfig-sync/scripts/run-checks.py . --ci --work "$RUNNER_TEMP/checks"

      - name: Checks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          USERPROFILE: ${{ runner.temp }}\home
          APPDATA: ${{ runner.temp }}\home\AppData\Roaming
        run: |
          .\.venv-agent-playbook\Scripts\python.exe -I shared\skills\qconfig-sync\scripts\run-checks.py . --ci --work "$env:RUNNER_TEMP\checks"
          exit $LASTEXITCODE

      - name: Keep check output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.os }}
          path: ${{ runner.temp }}/checks
          if-no-files-found: ignore

      - name: Uninstall restores the home
        shell: bash
        if: runner.os != 'Windows'
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          ./setup.sh --uninstall --purge
          test ! -e "$HOME/.claude/CLAUDE.md"
          test ! -e "$HOME/.agent-playbook/config"
